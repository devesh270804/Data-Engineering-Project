<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="1400" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Azure Data Engineering - Medallion Architecture</text>
  
  <!-- 1. ADF Section -->
  <g id="adf">
    <rect x="200" y="60" width="400" height="110" rx="12" fill="#e6f2ff" stroke="#0078d4" stroke-width="2"/>
    <!-- Factory Icon -->
    <g transform="translate(360, 80)">
      <rect x="0" y="15" width="80" height="40" rx="4" fill="#0078d4"/>
      <rect x="10" y="5" width="15" height="15" fill="#0078d4"/>
      <rect x="30" y="5" width="15" height="15" fill="#0078d4"/>
      <rect x="50" y="5" width="15" height="15" fill="#0078d4"/>
      <rect x="5" y="25" width="20" height="20" rx="2" fill="#ffffff"/>
      <rect x="30" y="25" width="20" height="20" rx="2" fill="#ffffff"/>
      <rect x="55" y="25" width="20" height="20" rx="2" fill="#ffffff"/>
    </g>
    <text x="400" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#0078d4">ADF Pipeline (Trigger - Scheduled / Manual)</text>
  </g>
  
  <!-- ADF to Databricks Arrows -->
  <line x1="320" y1="170" x2="280" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="260" y="210" font-size="11" fill="#555">Linked Service</text>
  <text x="260" y="222" font-size="11" fill="#555">(Databricks)</text>
  
  <line x1="480" y1="170" x2="520" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="540" y="280" font-size="11" fill="#555">Linked Service</text>
  <text x="540" y="292" font-size="11" fill="#555">(Databricks)</text>
  
  <!-- 2. Bronze Layer -->
  <g id="bronze">
    <rect x="150" y="240" width="500" height="130" rx="12" fill="#fff3e6" stroke="#FF8C00" stroke-width="2"/>
    <!-- Storage Icon -->
    <g transform="translate(370, 255)">
      <rect x="0" y="10" width="60" height="45" rx="5" fill="#FF8C00"/>
      <rect x="5" y="0" width="50" height="15" rx="3" fill="#FF8C00"/>
      <rect x="10" y="20" width="40" height="8" rx="2" fill="#ffffff"/>
      <rect x="10" y="32" width="30" height="8" rx="2" fill="#ffffff"/>
      <rect x="10" y="44" width="35" height="8" rx="2" fill="#ffffff"/>
    </g>
    <text x="400" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#cc5500">Bronze Layer (Raw CSV Data)</text>
    <text x="400" y="345" text-anchor="middle" font-size="12" fill="#666">Customer_data.csv  |  Sales_data.csv  |  Product_data.csv</text>
  </g>
  
  <!-- Bronze to Silver Arrow -->
  <line x1="400" y1="370" x2="400" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="400" font-size="11" fill="#555">Raw Ingestion</text>
  
  <!-- 3. Databricks Silver -->
  <g id="databricks-silver">
    <rect x="150" y="420" width="500" height="130" rx="12" fill="#e8eef4" stroke="#5B7C99" stroke-width="2"/>
    <!-- Databricks Icon -->
    <g transform="translate(370, 435)">
      <polygon points="30,0 60,20 30,40 0,20" fill="#5B7C99"/>
      <polygon points="30,8 48,20 30,32 12,20" fill="#ffffff"/>
      <circle cx="30" cy="20" r="6" fill="#5B7C99"/>
    </g>
    <text x="400" y="495" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d5a73">Databricks - Silver Layer Processing</text>
    <text x="400" y="515" text-anchor="middle" font-size="12" fill="#666">Data Cleaning  |  Column Standardization  |  Data Type Fixes</text>
  </g>
  
  <!-- Databricks Silver to Silver Layer Arrow -->
  <line x1="400" y1="550" x2="400" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="580" font-size="11" fill="#555">Transformation</text>
  
  <!-- 4. Silver Layer -->
  <g id="silver">
    <rect x="150" y="600" width="500" height="100" rx="12" fill="#e8eef4" stroke="#5B7C99" stroke-width="2"/>
    <!-- Storage Icon -->
    <g transform="translate(370, 610)">
      <rect x="0" y="10" width="60" height="40" rx="5" fill="#5B7C99"/>
      <rect x="5" y="0" width="50" height="12" rx="3" fill="#5B7C99"/>
      <rect x="10" y="18" width="40" height="6" rx="2" fill="#ffffff"/>
      <rect x="10" y="28" width="30" height="6" rx="2" fill="#ffffff"/>
      <rect x="10" y="38" width="35" height="6" rx="2" fill="#ffffff"/>
    </g>
    <text x="400" y="675" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d5a73">Silver Layer (Cleaned Delta Tables)</text>
  </g>
  
  <!-- Silver to Gold Databricks Arrow -->
  <line x1="400" y1="700" x2="400" y2="750" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="730" font-size="11" fill="#555">Processed Data</text>
  
  <!-- 5. Databricks Gold -->
  <g id="databricks-gold">
    <rect x="150" y="750" width="500" height="130" rx="12" fill="#fffbe6" stroke="#cc9900" stroke-width="2"/>
    <!-- Databricks Icon -->
    <g transform="translate(370, 765)">
      <polygon points="30,0 60,20 30,40 0,20" fill="#cc9900"/>
      <polygon points="30,8 48,20 30,32 12,20" fill="#ffffff"/>
      <circle cx="30" cy="20" r="6" fill="#cc9900"/>
    </g>
    <text x="400" y="825" text-anchor="middle" font-size="14" font-weight="bold" fill="#996600">Databricks - Gold Layer Modeling</text>
    <text x="400" y="845" text-anchor="middle" font-size="12" fill="#666">Star Schema  |  Fact + Dimension Tables  |  Broadcast Joins</text>
  </g>
  
  <!-- Databricks Gold to Gold Layer Arrow -->
  <line x1="400" y1="880" x2="400" y2="930" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="910" font-size="11" fill="#555">Aggregation</text>
  
  <!-- 6. Gold Layer -->
  <g id="gold">
    <rect x="150" y="930" width="500" height="130" rx="12" fill="#fffbe6" stroke="#cc9900" stroke-width="2"/>
    <!-- Storage Icon -->
    <g transform="translate(370, 945)">
      <rect x="0" y="10" width="60" height="40" rx="5" fill="#cc9900"/>
      <rect x="5" y="0" width="50" height="12" rx="3" fill="#cc9900"/>
      <rect x="10" y="18" width="40" height="6" rx="2" fill="#ffffff"/>
      <rect x="10" y="28" width="30" height="6" rx="2" fill="#ffffff"/>
      <rect x="10" y="38" width="35" height="6" rx="2" fill="#ffffff"/>
    </g>
    <text x="400" y="1010" text-anchor="middle" font-size="14" font-weight="bold" fill="#996600">Gold Layer (Business Ready Data)</text>
    <text x="400" y="1030" text-anchor="middle" font-size="12" fill="#666">fact_sales  |  dim_customer  |  dim_product  |  dim_date</text>
  </g>
  
  <!-- Gold to Power BI Arrow -->
  <line x1="400" y1="1060" x2="400" y2="1110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="1090" font-size="11" fill="#555">Business Data</text>
  
  <!-- 7. Power BI -->
  <g id="powerbi">
    <rect x="150" y="1110" width="500" height="130" rx="12" fill="#e6f2ff" stroke="#0078d4" stroke-width="2"/>
    <!-- Power BI Icon -->
    <g transform="translate(370, 1125)">
      <rect x="5" y="25" width="12" height="20" rx="2" fill="#0078d4"/>
      <rect x="22" y="15" width="12" height="30" rx="2" fill="#0078d4"/>
      <rect x="39" y="5" width="12" height="40" rx="2" fill="#0078d4"/>
      <rect x="5" y="30" width="12" height="15" fill="#ffffff" opacity="0.3"/>
      <rect x="22" y="20" width="12" height="25" fill="#ffffff" opacity="0.3"/>
      <rect x="39" y="10" width="12" height="35" fill="#ffffff" opacity="0.3"/>
    </g>
    <text x="400" y="1190" text-anchor="middle" font-size="14" font-weight="bold" fill="#0078d4">Power BI Dashboard (Visualization)</text>
    <text x="400" y="1210" text-anchor="middle" font-size="12" fill="#666">KPIs  |  Sales Trends  |  Regional Analysis</text>
  </g>
  
  <!-- Power BI to Notification Arrow -->
  <line x1="400" y1="1240" x2="400" y2="1290" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="460" y="1270" font-size="10" fill="#555">Dataset Refresh</text>
  <text x="460" y="1282" font-size="10" fill="#555">(Conceptual - via REST API)</text>
  
  <!-- 8. Notification -->
  <g id="notification">
    <rect x="200" y="1290" width="400" height="80" rx="12" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
    <!-- Email Icon -->
    <g transform="translate(370, 1300)">
      <rect x="0" y="5" width="60" height="40" rx="4" fill="#666"/>
      <polygon points="0,5 30,28 60,5" fill="#999"/>
      <polygon points="2,8 30,30 58,8" fill="#ffffff" opacity="0.3"/>
      <circle cx="50" cy="12" r="8" fill="#ff4444"/>
      <text x="50" y="16" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">1</text>
    </g>
    <text x="400" y="1360" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">Email Notification / Alert</text>
  </g>
  
  <!-- 9. Legend -->
  <g id="legend">
    <rect x="620" y="1280" width="160" height="100" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="700" y="1300" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Legend</text>
    <rect x="635" y="1310" width="16" height="16" rx="3" fill="#FF8C00"/>
    <text x="660" y="1322" font-size="11" fill="#555">Bronze = Raw Data</text>
    <rect x="635" y="1332" width="16" height="16" rx="3" fill="#5B7C99"/>
    <text x="660" y="1344" font-size="11" fill="#555">Silver = Cleaned Data</text>
    <rect x="635" y="1354" width="16" height="16" rx="3" fill="#FFD700"/>
    <text x="660" y="1366" font-size="11" fill="#555">Gold = Business Layer</text>
  </g>
  
</svg>